server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    # Serve SEO files as static XML/text (never fall back to SPA HTML)
    location = /sitemap.xml {
        default_type application/xml;
        add_header Content-Type "application/xml; charset=utf-8";
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|xml|txt)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
